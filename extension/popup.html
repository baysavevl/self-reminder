<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Self Reminder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="eyebrow">SELF REMINDER</div>
      <h1>Nhắc đúng lúc.</h1>
      <p class="muted">Mở lịch của bạn ngay từ toolbar.</p>
      <button id="open" class="primary">Mở lịch của tôi</button>
      <div class="grid">
        <button data-path="/#new">＋ Thêm lịch</button>
        <button data-path="/telegram">Telegram</button>
      </div>
      <p class="hint">Dữ liệu vẫn được lưu trong database của webapp, extension không lưu bản sao local.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
